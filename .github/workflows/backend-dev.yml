name: Backend dev pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: backend-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validar y desplegar backend
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test -- --runInBand

      - name: Construir backend
        run: npm run build

      - name: Desplegar a Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Configura RENDER_DEPLOY_HOOK en Settings > Secrets and variables > Actions."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
